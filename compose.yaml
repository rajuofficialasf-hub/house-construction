# Local development only.
#   docker compose up           database + S3 + migrations + seed + API (http://localhost:3001) + UI (http://localhost:5173)
#                               (the seed runs only on a database that has never had records, so a fresh volume)
#   docker compose up -d db     database only, for running the server tests
#   docker compose up -d db s3  database and S3, for running the API or UI on the host
# Every port is bound to 127.0.0.1 so nothing is reachable from the network (DB-ROLE-03).
# The UI uses the local API (the REST backend) by default; VITE_HOUSING_BACKEND=mock runs it without one.
# api and web run the host's source with their own node_modules volumes; see scripts/docker-dev-entry.sh.
# Only the files each one needs are mounted, read-only: dependency code never sees .env files and
# can't write to the checkout. init: true forwards stop signals so the API shuts down cleanly.
x-node-dev: &node-dev
  image: node:22
  init: true
  entrypoint: ["sh", "/entry.sh"]

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      HOUSING_OWNER_PASSWORD: ${HOUSING_OWNER_PASSWORD:-housing_owner_local}
      HOUSING_APP_PASSWORD: ${HOUSING_APP_PASSWORD:-housing_app_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - housing-db:/var/lib/postgresql/data
      - ./server/db/roles.sql:/housing/roles.sql:ro
      - ./server/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d housing"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The local stand-in for the private S3 bucket that holds the photos. MinIO no longer publishes a
  # server image, so this is SeaweedFS's S3 gateway (Apache-2.0). It checks signatures like AWS, answers
  # a missing key with 404 and refuses anonymous reads. weed mini creates both buckets at start and
  # creates no others, so a wrong S3_BUCKET fails as it would on AWS. The keys are local-only.
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-bucket=housing-photos,housing-photos-test", "-s3.autoCreateBucket=false", "-admin.ui=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-housing_s3_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-housing_s3_local_secret}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - housing-s3:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *node-dev
    working_dir: /app/server
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed -- --if-empty && exec npm run dev"]
    environment:
      NODE_ENV: development
      # Lets db:seed accept this network's database host, db (server/scripts/db-seed.ts).
      HOUSING_DEV_COMPOSE: "1"
      # The API defaults to loopback; inside the container it must listen on all interfaces.
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: info
      TRUST_PROXY: 0
      # The web container and the public-rest Playwright project's dev server (playwright.config.ts).
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5173},http://localhost:5185
      PUBLIC_READ_ORIGINS: ${PUBLIC_READ_ORIGINS:-}
      COOKIE_SECURE: "false"
      # Photos go to the S3 driver on the s3 service; stored URLs start with PUBLIC_API_URL.
      PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
      STORAGE_DRIVER: s3
      S3_BUCKET: housing-photos
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3:8333
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-housing_s3_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-housing_s3_local_secret}
      DATABASE_URL: postgres://housing_app:${HOUSING_APP_PASSWORD:-housing_app_local}@db:5432/housing?sslmode=disable
      DATABASE_MIGRATION_URL: postgres://housing_owner:${HOUSING_OWNER_PASSWORD:-housing_owner_local}@db:5432/housing?sslmode=disable
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - ./scripts/docker-dev-entry.sh:/entry.sh:ro
      - ./server/package.json:/app/server/package.json:ro
      - ./server/package-lock.json:/app/server/package-lock.json:ro
      - ./server/tsconfig.json:/app/server/tsconfig.json:ro
      - ./server/src:/app/server/src:ro
      - ./server/db:/app/server/db:ro
      - ./server/scripts:/app/server/scripts:ro
      - api-node-modules:/app/server/node_modules
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  web:
    <<: *node-dev
    working_dir: /app
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      VITE_HOUSING_BACKEND: ${VITE_HOUSING_BACKEND:-rest}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${API_PORT:-3001}}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./scripts/docker-dev-entry.sh:/entry.sh:ro
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - web-node-modules:/app/node_modules

volumes:
  housing-db:
  housing-s3:
  api-node-modules:
  web-node-modules:
