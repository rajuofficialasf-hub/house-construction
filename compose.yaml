# Local development only.
#   docker compose up        database + API (http://localhost:3001) + UI (http://localhost:5173)
#   docker compose up -d db  database only, for running the API or UI on the host
# Every port is bound to 127.0.0.1 so nothing is reachable from the network (DB-ROLE-03).
# The UI uses the mock backend by default; VITE_HOUSING_BACKEND=rest points it at the local API.
# api and web run on the host's source with their own node_modules volumes; see scripts/docker-dev-entry.sh.
x-node-dev: &node-dev
  image: node:22
  entrypoint: ["sh", "/app/scripts/docker-dev-entry.sh"]

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      HOUSING_OWNER_PASSWORD: ${HOUSING_OWNER_PASSWORD:-housing_owner_local}
      HOUSING_APP_PASSWORD: ${HOUSING_APP_PASSWORD:-housing_app_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - housing-db:/var/lib/postgresql/data
      - ./server/db/roles.sql:/housing/roles.sql:ro
      - ./server/db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d housing"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *node-dev
    working_dir: /app/server
    command: ["sh", "-c", "npm run db:migrate && npm run dev"]
    environment:
      NODE_ENV: development
      PORT: 3001
      LOG_LEVEL: info
      TRUST_PROXY: 0
      DATABASE_URL: postgres://housing_app:${HOUSING_APP_PASSWORD:-housing_app_local}@db:5432/housing?sslmode=disable
      DATABASE_MIGRATION_URL: postgres://housing_owner:${HOUSING_OWNER_PASSWORD:-housing_owner_local}@db:5432/housing?sslmode=disable
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - .:/app
      - api-node-modules:/app/server/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *node-dev
    working_dir: /app
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      VITE_HOUSING_BACKEND: ${VITE_HOUSING_BACKEND:-mock}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${API_PORT:-3001}}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules

volumes:
  housing-db:
  api-node-modules:
  web-node-modules:
