# Security headers for the static UI (included by every UI location in locations.conf). The API
# sets its own with helmet. The UI talks only to its own origin: the API is /api/v1 on the same
# vhost, and photo URLs are PUBLIC_API_URL (the same origin) + /api/v1/photos/<id>. blob: is for
# the upload previews; Google Fonts is loaded by index.html.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
